{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto">
  <h1>Sign in</h1>
  {% if error %}<div class="banner stop">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <h3>Email</h3><input name="email" type="email" required autofocus>
    <h3>Password</h3><input name="password" type="password" required>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p class="muted">New patient? <a href="/register">Create an account</a></p>
  <p class="muted">Demo accounts — patient@demo.local / patient123 · staff@demo.local / staff123</p>
</div>
{% endblock %}
